<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>An 消息中心</title>
<style>
:root{--bg:#0f1110;--panel:#171a18;--ink:#eceae6;--dim:#9a968e;--line:rgba(255,255,255,.09);--acc:#e0b174;--ok:#8fbf8f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overscroll-behavior:none}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:18px}
header .t{font-size:16px;font-weight:600}
header .s{font-size:11px;color:var(--ok);font-family:monospace}
#tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:9px 0;background:transparent;border:0;color:var(--dim);font-size:13px;border-bottom:2px solid transparent}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:84%;padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#2b4a68;border-bottom-right-radius:4px}
.an{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.meta{font-size:10px;color:var(--acc);margin-bottom:3px;font-family:monospace;opacity:.85}
.sys{align-self:center;font-size:11px;color:var(--dim);font-family:monospace}
footer{padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px}
#inp{flex:1;background:#0c0e0c;border:1px solid var(--line);border-radius:20px;padding:10px 15px;color:var(--ink);font-size:15px;outline:none}
#send{background:var(--acc);color:#111;border:0;border-radius:20px;padding:0 18px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="avatar">🌙</div>
  <div style="flex:1"><div class="t">An 消息中心</div><div class="s" id="sync">同步中…</div></div>
</header>
<div id="tabs">
  <button id="tab-all" class="on" onclick="switchTab('all')">An 与所有人</button>
  <button id="tab-mine" onclick="switchTab('mine')">我与 An</button>
</div>
<div id="chat"></div>
<footer>
  <input id="inp" placeholder="发消息给 An…" autocomplete="off">
  <button id="send" onclick="sendMsg()">发送</button>
</footer>
<script>
const READ='https://cdn.jsdelivr.net/gh/Lizn103/an-app-data@main/data.json';
const READ2='https://raw.githubusercontent.com/Lizn103/an-app-data/main/data.json';
const DB='https://textdb.dev/api/data/an-app-channel-01';
const KEY='an.app.seen.v2';
const $=id=>document.getElementById(id);
let tab='all', seenOut=Number(localStorage.getItem(KEY)||0), cache={chats:[],outbox:[]};
function add(cls,text,meta){
  const d=document.createElement('div');d.className='msg '+cls;
  if(meta){const w=document.createElement('div');w.className='meta';w.textContent=meta;d.appendChild(w);}
  d.appendChild(document.createTextNode(text));
  $('chat').appendChild(d);$('chat').scrollTop=1e9;
}
function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9;}
function render(){
  $('chat').innerHTML='';
  if(tab==='all'){
    const ch=cache.chats||[];
    if(!ch.length){sys('暂无聊天记录，等 An 和人聊过天就出现在这里');}
    for(const m of ch){
      const isAn=m.d==='an';
      const who=isAn?('An → '+(m.who||'').slice(0,8)):((m.who||'用户').slice(0,10)+' → An');
      add(isAn?'an':'me',m.text,(m.t||'')+' · '+who);
    }
  }else{
    const out=cache.outbox||[];
    if(!out.length){sys('暂无对话，发一条消息吧');}
    for(const m of out){
      const isAn=m.from==='an';
      add(isAn?'an':'me',m.text,(m.t?m.t+' · ':'')+(isAn?'An':'我'));
    }
    for(const m of (cache.chats||[]).slice(-5)){
      if(m.who==='App-boss'){add('me',m.text,(m.t||'')+' · 我(App)');}
    }
  }
}
function switchTab(t){tab=t;$('tab-all').classList.toggle('on',t==='all');$('tab-mine').classList.toggle('on',t==='mine');render();}
async function poll(force){
  try{
    let d=null;
    try{const r=await fetch(READ+'?t='+Math.floor(Date.now()/30000));d=await r.json();}catch(e){}
    if(!d){const r2=await fetch(READ2+'?t='+Date.now());d=await r2.json();}
    cache=d||{chats:[],outbox:[]};
    render();
    let fresh=0;
    for(const m of (cache.outbox||[])){if((m.id||0)>seenOut){seenOut=m.id;fresh++;}}
    localStorage.setItem(KEY,seenOut);
    $('sync').textContent='已同步 '+(cache.chats||[]).length+' 条 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){$('sync').textContent='离线，重试中…';}
}
async function sendMsg(){
  const v=$('inp').value.trim();if(!v)return;
  $('inp').value='';
  add('me',v,'刚刚 · 我');
  try{
    const cur=await(await fetch(DB+'?t='+Date.now())).json();
    const inbox=cur.inbox||[];
    const id=(inbox.length?inbox[inbox.length-1].id:0)+1;
    inbox.push({id,from:'boss',text:v,ts:Date.now()});
    await fetch(DB,{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body:JSON.stringify({inbox,outbox:cur.outbox||[]})});
    sys('已送达，An 处理中…');
  }catch(e){sys('⚠️ 发送失败，稍后重试');}
}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
poll(true);setInterval(poll,20000);
</script>
</body>
</html>
