<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>An</title>
<style>
:root{--bg:#0f1110;--panel:#171a18;--ink:#eceae6;--dim:#9a968e;--line:rgba(255,255,255,.09);--acc:#e0b174}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column;overscroll-behavior:none}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;font-size:18px}
header .t{font-size:16px;font-weight:600}
header .s{font-size:11px;color:var(--ok);font-family:monospace}
#chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:#2b4a68;border-bottom-right-radius:4px}
.an{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.sys{align-self:center;font-size:11px;color:var(--dim);font-family:monospace}
.typing{align-self:flex-start;color:var(--dim);font-size:12px;padding:4px 12px;display:none}
footer{padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px}
#inp{flex:1;background:#0c0e0c;border:1px solid var(--line);border-radius:20px;padding:10px 15px;color:var(--ink);font-size:15px;outline:none}
#send{background:var(--acc);color:#111;border:0;border-radius:20px;padding:0 18px;font-size:15px;font-weight:600}
#refresh{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:20px;width:40px;font-size:15px}
</style>
</head>
<body>
<header>
  <div class="avatar">🌙</div>
  <div style="flex:1"><div class="t">An</div><div class="s" id="sync">同步中…</div></div>
  <button id="refresh" onclick="poll(true)">↻</button>
</header>
<div id="chat"></div>
<div class="typing" id="typing">An 正在输入…</div>
<footer>
  <input id="inp" placeholder="发消息给 An…" autocomplete="off">
  <button id="send" onclick="sendMsg()">发送</button>
</footer>
<script>
const DB='https://textdb.dev/api/data/an-app-channel-01';
const PAGE='https://Lizn103.github.io/an-app-data/';
const KEY='an_app_seen';
let seen=Number(localStorage.getItem(KEY)||0), sending=false;
const $=id=>document.getElementById(id);
function add(cls,text){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('chat').appendChild(d);$('chat').scrollTop=1e9;}
function sys(t){const d=document.createElement('div');d.className='sys';d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9;}
async function db(){const r=await fetch(DB+'?t='+Date.now());return r.json();}
async function push(o){const cur=await db();const k=cur.inbox||[];k.push(o);await fetch(DB,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({inbox:k,outbox:cur.outbox||[]})});}
async function poll(force){
  try{
    const cur=await db();
    const out=cur.outbox||[];
    let fresh=0;
    for(const m of out){
      if(m.id>seen){add('an',m.text);seen=m.id;fresh++;localStorage.setItem(KEY,seen);}
    }
    if(fresh||force){$('sync').textContent='已同步 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}
    else{$('sync').textContent='在线 · '+out.length+' 条';}
  }catch(e){$('sync').textContent='离线重试中…';}
}
async function sendMsg(){
  const v=$('inp').value.trim();if(!v||sending)return;
  sending=true;$('inp').value='';add('me',v);
  $('typing').style.display='block';
  try{
    const cur=await db();
    const inbox=cur.inbox||[];
    const id=(inbox.length?inbox[inbox.length-1].id:0)+1;
    inbox.push({id,from:'boss',text:v,ts:Date.now()});
    await fetch(DB,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({inbox,outbox:cur.outbox||[]})});
  }catch(e){add('me','⚠️ 发送失败，重试一次');}
  $('typing').style.display='none';sending=false;
}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
add('an','你好！这里是 An 的消息中心 🌙\n发消息给我，我会看到并回复。');
poll(true);setInterval(poll,15000);
</script>
</body>
</html>
